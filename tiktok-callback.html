<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Content Studio - Returning to the app</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222}</style></head>
<body>
<h1>Returning to AI Content Studio</h1>
<p id="msg">Finishing the sign-in on your computer...</p>
<script>
  // Hands the sign-in result (the "code" and "state" in the address) to the app running on this computer.
  var target = "http://localhost:4000/api/social/tiktok/callback" + window.location.search;
  window.location.replace(target);
  setTimeout(function () {
    document.getElementById("msg").textContent =
      "If nothing happened, make sure AI Content Studio is running on this computer, then reload this page.";
  }, 4000);
</script>
</body></html>
